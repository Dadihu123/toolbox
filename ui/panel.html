<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Toolbox</title>
<script>
/* Theme before the first paint. The host injects `window.__TOOLBOX_ENV__`
   (src-tauri/src/windows/panel.rs); without it — a plain browser via `pnpm dev` —
   follow the OS. This is the only place `prefers-color-scheme` is consulted; the
   token block itself is driven exclusively by `data-theme`. */
(function () {
  var env = window.__TOOLBOX_ENV__;
  var theme = env && env.theme;
  if (theme !== "light" && theme !== "dark") {
    theme = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
  }
  var root = document.documentElement;
  root.setAttribute("data-theme", theme);
  root.style.colorScheme = theme;
})();
</script>
<link rel="stylesheet" href="./shared/theme.css">
<style>
  * { box-sizing: border-box; }
  html, body {
    height: 100%; margin: 0; overflow: hidden;
    background: transparent;
    color: var(--fg);
    font: 13px/1.5 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    user-select: none;
    -webkit-font-smoothing: antialiased;
  }
  #panel {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    background: var(--panel-bg);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
    /* Deliberately no outer box-shadow. The window is exactly this element's
       rectangle and transparent, so a drop shadow would be clipped at the
       window edge and only survive inside the four border-radius corner
       cut-outs — showing up as the semi-transparent right-angle haze the
       rounded panel is supposed to hide. Elevation stays inside the shape. */
    box-shadow: var(--panel-inset), var(--panel-inset-line);
  }
  /* ---- search ---- */
  #searchbar {
    display: flex; align-items: center; gap: 9px;
    padding: 13px 15px;
    border-bottom: 1px solid var(--line-soft);
    flex: 0 0 auto;
  }
  #searchbar svg { flex: 0 0 auto; color: var(--fg-faint); }
  #search {
    flex: 1; min-width: 0;
    background: none; border: none; outline: none;
    color: var(--fg); font: inherit; font-size: 14px;
  }
  #search::placeholder { color: var(--fg-faint); }
  #esc-hint {
    font-size: 11px; color: var(--fg-faint);
    border: 1px solid var(--line); border-radius: 4px;
    padding: 1px 5px; flex: 0 0 auto;
  }
  /* ---- list ---- */
  #results { flex: 1; overflow-y: auto; padding: 6px; }
  #results::-webkit-scrollbar { width: 8px; }
  #results::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border-radius: 4px; }
  .group-label {
    font-size: 11px; color: var(--fg-faint);
    padding: 8px 9px 4px; letter-spacing: 0.04em;
  }
  .row {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 9px; border-radius: 8px;
    cursor: pointer;
  }
  .row.sel { background: var(--bg3); }
  .row.sel .row-title { color: var(--sel-title); }
  .row-icon {
    width: 30px; height: 30px; flex: 0 0 auto;
    border-radius: 8px; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 600; color: #fff;
    background: var(--accent-dim);
  }
  .row-icon img { width: 100%; height: 100%; object-fit: contain; }
  .row-main { flex: 1; min-width: 0; }
  .row-title {
    color: var(--fg); font-size: 13px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .row-sub {
    color: var(--fg-faint); font-size: 11px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .row-badge {
    flex: 0 0 auto; font-size: 10px; color: var(--fg-dim);
    border: 1px solid var(--line); border-radius: 4px; padding: 0 4px;
  }
  .row kbd {
    flex: 0 0 auto;
    font: 11px/1.4 "Cascadia Mono", Consolas, monospace;
    color: var(--fg-dim);
    background: var(--bg3);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 1px 5px;
  }
  .empty {
    color: var(--fg-faint); text-align: center;
    padding: 40px 20px; font-size: 12px;
  }
  /* ---- footer ---- */
  #footer {
    flex: 0 0 auto;
    display: flex; align-items: center; gap: 6px;
    padding: 9px 11px;
    border-top: 1px solid var(--line-soft);
    background: var(--panel-foot);
  }
  .fbtn {
    display: flex; align-items: center; gap: 5px;
    background: none; border: 1px solid transparent; border-radius: 6px;
    color: var(--fg-dim); font: inherit; font-size: 12px;
    padding: 4px 8px; cursor: pointer;
  }
  .fbtn:hover { background: var(--bg3); color: var(--fg); }
  .fbtn:focus-visible { outline: 1px solid var(--accent); }
  #footer .spacer { flex: 1; }
  #version { color: var(--fg-faint); font-size: 11px; padding-right: 4px; }
</style>
</head>
<body>
<div id="panel">
  <div id="searchbar">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path>
    </svg>
    <input id="search" type="text" placeholder="搜索工具或功能…" data-i18n-placeholder="panel:search.placeholder" autocomplete="off" spellcheck="false" />
    <span id="esc-hint">Esc</span>
  </div>
  <div id="results"></div>
  <div id="footer">
    <button class="fbtn" data-act="main">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
        <rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M3 9h18"></path>
      </svg>
      <span data-i18n="common:openMain">主界面</span>
    </button>
    <button class="fbtn" data-act="refresh">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
        <path d="M20 11a8 8 0 1 0-2.3 5.7"></path><path d="M20 5v6h-6"></path>
      </svg>
      <span data-i18n="common:refresh">刷新</span>
    </button>
    <span class="spacer"></span>
    <span id="version"></span>
  </div>
</div>

<script type="module" src="./panel.js"></script>
</body>
</html>
