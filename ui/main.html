<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>工具箱 · Toolbox</title>
<style>
/* --- 1. Tokens & reset ------------------------------------------------------ */
:root {
  --bg: #14161a;
  --bg2: #1b1e24;
  --bg3: #22262e;
  --line: #323844;
  --line-soft: #272c36;
  --fg: #dfe3ea;
  --fg-dim: #98a1b0;
  --fg-faint: #6b7484;
  --accent: #4ea1ff;
  --accent-dim: #2b6cb0;
  --ok: #3ecf8e;
  --warn: #e8b23a;
  --danger: #e5484d;
  --accent-soft: rgba(78, 161, 255, .12);
  --ok-soft: rgba(62, 207, 142, .12);
  --warn-soft: rgba(232, 178, 58, .12);
  --danger-soft: rgba(229, 72, 77, .11);
  --mono: "Cascadia Mono", "Consolas", "Courier New", monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.55 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif; overflow: hidden; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { border: 0; padding: 0; background: none; }
button:not(:disabled) { cursor: pointer; }
a { color: var(--accent); text-decoration: none; cursor: pointer; }
code, kbd { font-family: var(--mono); }
::selection { background: rgba(78, 161, 255, .28); }
:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #303540; border: 3px solid var(--bg); border-radius: 10px; }
::-webkit-scrollbar-thumb:hover { background: #3c4350; }
/* --- 2. App shell, custom titlebar ------------------------------------------ */
.app { height: 100vh; display: flex; flex-direction: column; min-width: 0; }
.titlebar { height: 40px; flex: 0 0 40px; display: flex; align-items: center; justify-content: space-between; background: var(--bg2); border-bottom: 1px solid var(--line-soft); user-select: none; }
.titlebar-brand { display: flex; align-items: center; gap: 9px; height: 100%; padding-left: 14px; }
.titlebar-logo { display: grid; place-items: center; color: var(--accent); }
.titlebar-name { font-size: 12.5px; font-weight: 600; letter-spacing: .2px; }
.titlebar-sub { margin-left: 2px; padding-left: 9px; border-left: 1px solid var(--line); color: var(--fg-faint); font-size: 11px; }
.win-controls { display: flex; height: 100%; }
.win-btn { width: 46px; height: 100%; display: grid; place-items: center; color: var(--fg-dim); transition: background .15s, color .15s; }
.win-btn:hover { background: var(--bg3); color: var(--fg); }
.win-btn.win-close:hover { background: var(--danger); color: #fff; }
.win-btn:focus-visible { outline-offset: -2px; }
.shell { flex: 1; min-height: 0; display: flex; }
/* --- 3. Sidebar ------------------------------------------------------------- */
.sidebar { width: 200px; flex: 0 0 200px; min-height: 0; display: flex; flex-direction: column; background: var(--bg2); border-right: 1px solid var(--line-soft); }
.brand { display: flex; align-items: center; gap: 10px; padding: 18px 16px 15px; }
.brand-mark {
  width: 34px;
  height: 34px;
  flex: none;
  display: grid;
  place-items: center;
  border-radius: 10px;
  color: #fff;
  background: linear-gradient(145deg, var(--accent), var(--accent-dim));
  box-shadow: 0 5px 16px rgba(78, 161, 255, .18);
}
.brand-copy { display: flex; flex-direction: column; min-width: 0; line-height: 1.25; }
.brand-copy strong { font-size: 13.5px; font-weight: 600; letter-spacing: .3px; }
.brand-copy span { color: var(--fg-faint); font-size: 10px; letter-spacing: 1.2px; text-transform: uppercase; }
.nav { display: flex; flex-direction: column; gap: 2px; padding: 6px 8px; overflow-y: auto; }
.nav-item { position: relative; width: 100%; height: 36px; display: flex; align-items: center; gap: 10px; padding: 0 10px; border-radius: 8px; color: var(--fg-dim); text-align: left; transition: background .15s, color .15s; }
.nav-item:hover { background: var(--bg3); color: var(--fg); }
.nav-item.active { background: var(--bg3); color: var(--fg); }
.nav-item.active::before { content: ""; position: absolute; left: -8px; top: 9px; bottom: 9px; width: 2px; border-radius: 0 2px 2px 0; background: var(--accent); }
.nav-item svg { flex: none; opacity: .92; }
.nav-label { flex: 1; }
.nav-count { min-width: 20px; padding: 0 6px; border: 1px solid var(--line-soft); border-radius: 999px; background: var(--bg); color: var(--fg-faint); font-size: 10.5px; line-height: 17px; text-align: center; }
.side-foot { margin-top: auto; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 8px; border-top: 1px solid var(--line-soft); color: var(--fg-faint); font-size: 11px; }
.side-version { font-family: var(--mono); letter-spacing: .2px; }
/* --- 4. Content, page headers, shared pieces -------------------------------- */
.content { flex: 1; min-width: 0; overflow-y: auto; overflow-x: hidden; background: radial-gradient(900px 460px at 78% -12%, rgba(78, 161, 255, .07), transparent 65%), var(--bg); }
.page { max-width: 1140px; margin: 0 auto; padding: 28px 32px 44px; min-height: 100%; }
.page-enter { animation: page-in .18s ease-out both; }
@keyframes page-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
.page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 24px; }
.page-head h1 { margin: 0 0 6px; font-size: 22px; line-height: 1.2; font-weight: 650; letter-spacing: .2px; }
.page-head p { margin: 0; color: var(--fg-dim); font-size: 12.5px; }
.head-actions { display: flex; align-items: center; gap: 8px; padding-top: 2px; }
.page-badge { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 8px; border: 1px solid var(--line-soft); border-radius: 6px; background: var(--bg2); color: var(--fg-faint); font-size: 11px; white-space: nowrap; }
.page-badge .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px var(--ok-soft); }
.section { margin-top: 26px; }
.section.first { margin-top: 0; }
.section-head { display: flex; align-items: center; gap: 9px; min-height: 24px; margin-bottom: 11px; }
.section-head h2 { margin: 0; font-size: 13.5px; font-weight: 600; letter-spacing: .2px; }
.section-hint { margin-left: auto; color: var(--fg-faint); font-size: 11.5px; }
.count { min-width: 20px; padding: 0 6px; border: 1px solid var(--line-soft); border-radius: 999px; background: var(--bg2); color: var(--fg-faint); font-size: 10.5px; line-height: 17px; text-align: center; }
/* Buttons ----------------------------------------------------------------- */
.btn {
  height: 30px;
  padding: 0 11px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  border: 1px solid var(--line);
  border-radius: 7px;
  background: var(--bg3);
  color: var(--fg);
  font-size: 12px;
  line-height: 1;
  white-space: nowrap;
  user-select: none;
  transition: background .15s, border-color .15s, color .15s, transform .08s;
}
.btn:hover:not(:disabled) { background: var(--line-soft); border-color: var(--fg-faint); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: .42; cursor: not-allowed; }
.btn.primary { border-color: var(--accent); background: var(--accent); color: #0b111a; font-weight: 600; }
.btn.primary:hover:not(:disabled) { background: #65aeff; border-color: #65aeff; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--fg-dim); }
.btn.ghost:hover:not(:disabled) { background: var(--bg3); border-color: var(--line-soft); color: var(--fg); }
.btn.danger { border-color: rgba(229, 72, 77, .34); background: var(--danger-soft); color: var(--danger); }
.btn.danger:hover:not(:disabled) { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn.sm { height: 26px; padding: 0 9px; border-radius: 6px; font-size: 11.5px; }
.icon-btn { width: 28px; height: 28px; flex: none; display: grid; place-items: center; border: 1px solid transparent; border-radius: 6px; color: var(--fg-dim); transition: background .15s, border-color .15s, color .15s; }
.icon-btn:hover { background: var(--bg3); border-color: var(--line-soft); color: var(--fg); }
.link-btn { display: inline-flex; align-items: center; gap: 4px; color: var(--accent); font-size: 11.5px; transition: color .15s; }
.link-btn:hover { color: #7dbaff; text-decoration: underline; text-underline-offset: 2px; }
.link-btn:disabled { color: var(--fg-faint); cursor: not-allowed; text-decoration: none; }
/* Badges & pills ---------------------------------------------------------- */
.pill, .source-badge, .badge { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 7px; border: 1px solid var(--line-soft); border-radius: 5px; font-size: 10.5px; line-height: 1; white-space: nowrap; }
.version-pill { font-family: var(--mono); color: var(--fg-faint); background: var(--bg3); border-color: var(--line-soft); }
.source-official { color: var(--accent); background: var(--accent-soft); border-color: rgba(78, 161, 255, .28); }
.source-installed { color: var(--fg-dim); background: var(--bg3); border-color: var(--line-soft); }
.source-dev { color: var(--warn); background: var(--warn-soft); border-color: rgba(232, 178, 58, .28); }
.badge-ok { color: var(--ok); background: var(--ok-soft); border-color: rgba(62, 207, 142, .26); }
.badge-warn { color: var(--warn); background: var(--warn-soft); border-color: rgba(232, 178, 58, .26); }
/* kbd --------------------------------------------------------------------- */
kbd {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 1px 5px;
  border: 1px solid var(--line);
  border-radius: 2px;
  background: var(--bg3);
  color: var(--fg-dim);
  font-family: var(--mono);
  font-size: 11px;
  line-height: 1.6;
  white-space: nowrap;
}
/* --- 5. Tools tab ----------------------------------------------------------- */
.tool-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.tool-card { display: flex; flex-direction: column; gap: 12px; padding: 16px; border: 1px solid var(--line-soft); border-radius: 12px; background: var(--bg2); transition: border-color .18s, transform .18s, box-shadow .18s; }
.tool-card:hover { border-color: var(--line); transform: translateY(-1px); box-shadow: 0 10px 30px rgba(0, 0, 0, .18); }
.tool-card.is-disabled { opacity: .72; }
.tool-top { display: flex; align-items: flex-start; gap: 11px; min-width: 0; }
.tool-icon { width: 48px; height: 48px; flex: none; display: grid; place-items: center; border-radius: 11px; overflow: hidden; font-size: 18px; font-weight: 650; }
.tool-icon img { width: 100%; height: 100%; object-fit: cover; display: block; }
.tool-icon.sm { width: 34px; height: 34px; border-radius: 9px; font-size: 13px; }
.tool-title { flex: 1; min-width: 0; padding-top: 1px; }
.tool-name-row { display: flex; align-items: center; gap: 7px; min-width: 0; }
.tool-name-row h3 { margin: 0; overflow: hidden; color: var(--fg); font-size: 14px; font-weight: 600; letter-spacing: .1px; text-overflow: ellipsis; white-space: nowrap; }
.tool-meta { display: flex; align-items: center; gap: 7px; margin-top: 6px; min-width: 0; color: var(--fg-faint); font-size: 10.5px; }
.tool-author { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tool-desc { display: -webkit-box; min-height: 39px; margin: 0; overflow: hidden; color: var(--fg-dim); font-size: 12.5px; line-height: 1.55; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
.action-chips { display: flex; flex-wrap: wrap; gap: 6px; min-height: 23px; }
.action-chip { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; padding: 3px 7px; border: 1px solid var(--line-soft); border-radius: 6px; background: var(--bg3); color: var(--fg-dim); font-size: 11px; }
.chip-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip-empty { color: var(--fg-faint); font-size: 11px; }
.card-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: auto; padding-top: 11px; border-top: 1px solid var(--line-soft); }
.foot-right { display: flex; align-items: center; gap: 4px; }
.tool-state { display: inline-flex; align-items: center; gap: 5px; color: var(--fg-faint); font-size: 10.5px; }
.tool-state i { width: 5px; height: 5px; border-radius: 50%; background: var(--fg-faint); }
.tool-state.on { color: var(--ok); }
.tool-state.on i { background: var(--ok); box-shadow: 0 0 0 3px var(--ok-soft); }
.tool-state.off { color: var(--fg-faint); }
/* Market ------------------------------------------------------------------ */
.market-card { padding: 18px; border: 1px solid var(--line-soft); border-radius: 12px; background: var(--bg2); }
.market-intro { display: flex; align-items: flex-start; gap: 12px; }
.market-icon { width: 38px; height: 38px; flex: none; display: grid; place-items: center; border: 1px solid rgba(78, 161, 255, .24); border-radius: 10px; background: var(--accent-soft); color: var(--accent); }
.market-intro h3 { margin: 0 0 3px; font-size: 13.5px; font-weight: 600; }
.market-intro p { margin: 0; color: var(--fg-dim); font-size: 12px; }
.market-intro code { padding: 1px 4px; border-radius: 3px; background: var(--bg3); color: var(--fg-dim); font-size: 11px; }
.official-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(235px, 1fr)); gap: 8px; margin-top: 15px; }
.official-item { display: flex; align-items: center; gap: 10px; min-width: 0; padding: 9px 10px; border: 1px solid var(--line-soft); border-radius: 8px; background: var(--bg3); transition: border-color .15s, background .15s; }
.official-item:hover { border-color: var(--line); background: var(--line-soft); }
.official-info { flex: 1; min-width: 0; }
.official-name { overflow: hidden; font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
.official-sub { overflow: hidden; margin-top: 1px; color: var(--fg-faint); font-size: 10.5px; text-overflow: ellipsis; white-space: nowrap; }
.dropzone {
  width: 100%;
  margin-top: 15px;
  padding: 21px 18px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 5px;
  border: 1.5px dashed var(--line);
  border-radius: 10px;
  background: transparent;
  color: var(--fg-dim);
  text-align: center;
  transition: border-color .18s, background .18s, color .18s;
}
.dropzone:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); color: var(--fg); }
.dropzone:disabled { opacity: .55; cursor: wait; }
.dropzone svg { color: var(--accent); margin-bottom: 2px; }
.dropzone strong { font-size: 12.5px; font-weight: 600; }
.dropzone span { color: var(--fg-faint); font-size: 11px; }
.path-line { display: flex; align-items: center; gap: 8px; margin-top: 14px; min-width: 0; color: var(--fg-faint); font-size: 11px; }
.path-line code { min-width: 0; overflow: hidden; color: var(--fg-dim); font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
.path-line .link-btn { margin-left: auto; flex: none; }
/* --- 6. Hotkeys tab --------------------------------------------------------- */
.hk-section { margin-top: 24px; }
.hk-section:first-of-type { margin-top: 0; }
.hk-group-head { display: flex; align-items: center; gap: 9px; margin: 0 0 9px; }
.hk-group-head h2 { margin: 0; font-size: 13.5px; font-weight: 600; }
.hk-group-head .source-badge { height: 18px; }
.hk-table { overflow: hidden; border: 1px solid var(--line-soft); border-radius: 12px; background: var(--bg2); }
.hk-row {
  display: grid;
  grid-template-columns: minmax(160px, 1fr) 170px minmax(190px, 230px) 62px;
  align-items: center;
  gap: 12px;
  min-height: 48px;
  padding: 9px 14px;
  border-bottom: 1px solid var(--line-soft);
  transition: background .15s;
}
.hk-row:last-child { border-bottom: 0; }
.hk-row:not(.hk-head):hover { background: rgba(255, 255, 255, .018); }
.hk-row.is-recording { background: var(--accent-soft); }
.hk-head { min-height: 34px; padding-top: 0; padding-bottom: 0; background: var(--bg3); color: var(--fg-faint); font-size: 10.5px; letter-spacing: .4px; }
.hk-name { overflow: hidden; color: var(--fg-dim); font-size: 12.5px; text-overflow: ellipsis; white-space: nowrap; }
.hk-combo-wrap { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; min-width: 0; }
.kbd-btn {
  height: 28px;
  min-width: 64px;
  max-width: 100%;
  padding: 0 9px;
  overflow: hidden;
  border-color: var(--line);
  background: var(--bg3);
  color: var(--fg);
  font-size: 11px;
  text-overflow: ellipsis;
  transition: border-color .15s, background .15s, color .15s;
}
.kbd-btn:hover { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.kbd-btn.empty { color: var(--fg-faint); border-style: dashed; }
.kbd-btn.recording { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); animation: record-pulse 1.4s ease-in-out infinite; }
@keyframes record-pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(78, 161, 255, .2); } 50% { box-shadow: 0 0 0 3px rgba(78, 161, 255, .08); } }
.record-hint { color: var(--accent); font-size: 10px; white-space: nowrap; }
.hk-status-wrap { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.hk-status { display: flex; align-items: center; gap: 6px; min-width: 0; color: var(--fg-dim); font-size: 11.5px; }
.hk-status .dot { width: 6px; height: 6px; flex: none; border-radius: 50%; background: var(--fg-faint); }
.hk-status.ok { color: var(--ok); }
.hk-status.ok .dot { background: var(--ok); box-shadow: 0 0 0 3px var(--ok-soft); }
.hk-status.warn { color: var(--warn); }
.hk-status.warn .dot { background: var(--warn); box-shadow: 0 0 0 3px var(--warn-soft); }
.hk-status.unset { color: var(--fg-faint); }
.hk-reason { overflow: hidden; color: var(--warn); opacity: .82; text-overflow: ellipsis; white-space: nowrap; }
.hk-error { max-width: 100%; overflow: hidden; color: var(--danger); font-size: 10.5px; text-overflow: ellipsis; white-space: nowrap; }
.hk-action { display: flex; justify-content: flex-end; }
.hk-note {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  margin-top: 20px;
  padding: 10px 12px;
  border: 1px solid var(--line-soft);
  border-radius: 8px;
  background: var(--bg2);
  color: var(--fg-faint);
  font-size: 11.5px;
  line-height: 1.6;
}
.hk-note svg { flex: none; margin-top: 1px; color: var(--warn); }
/* --- 7. Settings tab -------------------------------------------------------- */
.settings-stack { display: flex; flex-direction: column; gap: 14px; }
.settings-card { overflow: hidden; border: 1px solid var(--line-soft); border-radius: 12px; background: var(--bg2); }
.settings-head { padding: 14px 18px 12px; border-bottom: 1px solid var(--line-soft); }
.settings-head h2 { margin: 0; font-size: 13.5px; font-weight: 600; }
.settings-head p { margin: 3px 0 0; color: var(--fg-faint); font-size: 11.5px; }
.setting-row { display: flex; align-items: center; justify-content: space-between; gap: 20px; min-height: 55px; padding: 13px 18px; border-bottom: 1px solid var(--line-soft); }
.setting-row:last-child { border-bottom: 0; }
.setting-label { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.setting-label > span { font-size: 12.5px; }
.setting-label small { color: var(--fg-faint); font-size: 11px; }
.setting-control { display: flex; align-items: center; gap: 9px; flex: none; }
.setting-control.wide { flex: 1; justify-content: flex-end; min-width: 0; }
.soon { color: var(--fg-faint); font-size: 10.5px; white-space: nowrap; }
.seg { display: inline-flex; align-items: center; gap: 2px; padding: 2px; border: 1px solid var(--line-soft); border-radius: 8px; background: var(--bg); }
.seg-item { height: 26px; padding: 0 10px; border-radius: 6px; color: var(--fg-dim); font-size: 11.5px; white-space: nowrap; transition: background .15s, color .15s; }
.seg-item:hover:not(:disabled) { background: var(--bg3); color: var(--fg); }
.seg-item.active { background: var(--accent-soft); color: var(--accent); }
.seg-item:disabled { cursor: not-allowed; opacity: .65; }
.switch { position: relative; width: 38px; height: 22px; flex: none; border: 1px solid var(--line); border-radius: 999px; background: var(--line-soft); transition: background .18s, border-color .18s; }
.switch .switch-thumb { position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--fg-faint); transition: left .18s, background .18s; }
.switch:hover { border-color: var(--fg-faint); }
.switch.on { border-color: var(--accent); background: var(--accent-dim); }
.switch.on .switch-thumb { left: 18px; background: #fff; }
.range-wrap { display: flex; align-items: center; gap: 10px; }
input[type="range"] { width: 190px; height: 20px; margin: 0; appearance: none; background: transparent; cursor: pointer; }
input[type="range"]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: linear-gradient(to right, var(--accent) var(--fill, 42%), var(--line) var(--fill, 42%)); }
input[type="range"]::-webkit-slider-thumb { width: 14px; height: 14px; margin-top: -5px; appearance: none; border: 2px solid var(--bg2); border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
input[type="range"]:focus-visible { outline: none; }
input[type="range"]:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 3px var(--accent-soft), 0 0 0 1px var(--accent); }
.range-out { min-width: 38px; color: var(--fg-dim); font-family: var(--mono); font-size: 11px; text-align: right; }
.path-box { display: flex; align-items: center; gap: 8px; min-width: 0; padding: 8px 10px; border: 1px solid var(--line-soft); border-radius: 8px; background: var(--bg); }

  const raw = String(hex || '').replace('#', '');
  const full = raw.length === 3 ? raw.split('').map((part) => part + part).join('') : raw;
  if (!/^[0-9a-f]{6}$/i.test(full)) return `rgba(78, 161, 255, ${alpha})`;
  const number = parseInt(full, 16);
  return `rgba(${(number >> 16) & 255}, ${(number >> 8) & 255}, ${number & 255}, ${alpha})`;

  const value = Number(bytes);
  if (!Number.isFinite(value) || value <= 0) return '—';

const FALLBACK_LOGS = [
  '[10:42:18] INFO  toolbox: host started, version 0.1.0',
  '[10:42:18] INFO  store: config loaded from data/config.json',
  '[10:42:18] INFO  tools: loaded 2 official tool(s)',

function makeFallbackHost() {
  const db = {
    version: '0.1.0',
    portable: true,
    dataDir: 'D:\\Toolbox\\data',
    officialToolsDir: 'D:\\Toolbox\\tools',
    installedToolsDir: 'D:\\Toolbox\\data\\tools',
    config: {
      locale: 'zh-CN', theme: 'dark', ballSide: 'right', ballY: 0.62,
      panelHotkey: 'Alt+Space', autostart: false, closeToTray: true
    },
    tools: FALLBACK_TOOLS.map((tool) => ({ ...tool, actions: tool.actions.map((a) => ({ ...a })) })),
    actions: FALLBACK_ACTIONS.map((action) => ({ ...action })),
    hotkeys: {}
  };

  const copy = (value) => JSON.parse(JSON.stringify(value));
  let inspects = 0;
  let pendingInspection = null;
  const findAction = (id) => db.actions.find((action) => action.id === id);
  const findTool = (id) => db.tools.find((tool) => tool.id === id);

  // Same rows as install.rs, so the preview shows the real review dialog.
  const PERMISSION_ROWS = [
    ['files.open', '读取文件', () => '读取你选择的文件', (p) => p.filesOpen],
    ['files.save', '保存文件', () => '弹出保存对话框并写入你选择的文件', (p) => p.filesSave],
    ['clipboard.read', '读取剪贴板', () => '读取系统剪贴板内容', (p) => p.clipboardRead],
    ['clipboard.write', '写入剪贴板', () => '写入系统剪贴板', (p) => p.clipboardWrite],
    ['data', '本地数据', (p, id) => `在 data/tool-data/${id} 下保存私有数据`, (p) => p.data],
    ['external.open', '外部链接', () => '用系统浏览器打开链接', (p) => p.externalOpen],
    ['network', '网络访问', (p) => (p.network.length ? `访问指定网络域名：${p.network.join('、')}` : '访问指定网络域名'), (p) => p.network.length > 0]
  ];
  function permissionItems(permissions, id) {
    return PERMISSION_ROWS.map(([key, label, detail, bit]) => ({
      key, label, bit: Boolean(bit(permissions)), detail: detail(permissions, id)
    }));
  }
  // One fake zip for every "install" click; the second review of the same id
  // becomes an upgrade so the warning can be demoed without reinstalling.
  function mockInspection() {
    inspects += 1;
    const id = 'local-demo-tool';
    const existing = findTool(id);
    const permissions = {
      filesOpen: true, filesSave: true, clipboardRead: false, clipboardWrite: true,
      data: true, externalOpen: true, network: ['api.example.com', 'cdn.example.com']
    };
    pendingInspection = {
      ok: true, error: '',
      inspectionId: `mock-inspection-${inspects}`,
      zipPath: 'D:\\Downloads\\demo-tool-1.2.0.zip',
      id, name: '演示工具', version: '1.2.0', author: '社区 · 示例作者',
      description: '从本地 zip 安装的第三方工具示例：演示安装前的权限确认流程。',
      entry: 'index.html', fileCount: 18, totalBytes: 482304, iconDataUrl: null,
      isUpgrade: Boolean(existing),
      existingSource: existing ? 'installed' : '',
      permissions,
      permissionItems: permissionItems(permissions, id)
    };
    return pendingInspection;
  }
  function grantFromKeys(permissions, granted) {
    const keys = new Set(Array.isArray(granted) ? granted : Object.keys(granted || {}).filter((key) => granted[key]));
    return {
      filesOpen: keys.has('files.open') && Boolean(permissions.filesOpen),
      filesSave: keys.has('files.save') && Boolean(permissions.filesSave),
      clipboardRead: keys.has('clipboard.read') && Boolean(permissions.clipboardRead),
      clipboardWrite: keys.has('clipboard.write') && Boolean(permissions.clipboardWrite),
      data: keys.has('data') && Boolean(permissions.data),
      externalOpen: keys.has('external.open') && Boolean(permissions.externalOpen),
      network: keys.has('network') ? [...permissions.network] : []
    };
  }

  // Keep the tool card chips and the hotkey map in step with the action rows.
  function applyAction(action) {
    db.hotkeys[action.id] = {
      combo: action.combo, defaultCombo: action.defaultCombo,
      effective: action.effective, reason: action.reason
    };
    if (action.scope !== 'tool') return;
    const entry = findTool(action.toolId)?.actions.find((item) => item.id === action.id);
    if (entry) entry.combo = action.combo;
  }

  async function invoke(cmd, args = {}) {
    await sleep(65);
    switch (cmd) {
      case 'get_state': return copy(db);
      case 'open_tool': case 'close_tool': case 'open_panel': case 'open_main':
      case 'close_window': case 'quit_app': case 'restart_app': return { ok: true };

      case 'set_tool_enabled': {
        const tool = findTool(args.id);
        if (!tool) return { ok: false, error: '工具不存在' };
        tool.enabled = Boolean(args.enabled);
        return { ok: true };
      }
      case 'uninstall_tool': {
        const tool = findTool(args.id);
        if (!tool) return { ok: false, error: '工具不存在' };
        if (tool.source === 'official') return { ok: false, error: '官方工具不可卸载' };
        db.tools = db.tools.filter((item) => item.id !== args.id);
        const removed = db.actions.filter((action) => action.toolId === args.id).map((action) => action.id);
        db.actions = db.actions.filter((action) => action.toolId !== args.id);
        removed.forEach((id) => delete db.hotkeys[id]);
        return { ok: true };
      }
      case 'inspect_tool_zip':
        return mockInspection();
      case 'install_tool': {
        const pending = pendingInspection;
        if (!pending || (args.inspectionId && args.inspectionId !== pending.inspectionId)) {
          pendingInspection = null;
          return { ok: false, error: '安装会话已失效，请重新选择工具包' };
        }
        pendingInspection = null;
        if (args.granted === null || args.granted === undefined) return { ok: false, error: 'cancelled' };
        const permissions = grantFromKeys(pending.permissions, args.granted);
        const existing = findTool(pending.id);
        const actionId = `${pending.id}.run`;
        const installed = {
          id: pending.id, name: pending.name, description: pending.description,
          version: pending.version, author: pending.author, source: 'installed',
          enabled: true, accent: '#3ecf8e', iconDataUrl: pending.iconDataUrl || null,
          dir: `${db.installedToolsDir}\\${pending.id}`, sizeBytes: pending.totalBytes,
          permissions, granted: true,
          actions: existing ? existing.actions : [{ id: actionId, title: '运行工具', combo: '' }]
        };
        if (existing) Object.assign(existing, installed);
        else {
          db.tools.push(installed);
          db.actions.push({ id: actionId, scope: 'tool', toolId: pending.id, title: '运行工具', combo: '', defaultCombo: '', effective: false, reason: '未设置' });
          db.hotkeys[actionId] = { combo: '', defaultCombo: '', effective: false, reason: '未设置' };
        }
        return { ok: true, id: pending.id, name: pending.name };
      }
      case 'set_hotkey': {
        const action = findAction(args.actionId);
        if (!action) return { ok: false, reason: '快捷键项不存在' };
        const combo = String(args.combo || '').trim();
        if (!combo) return { ok: false, reason: '组合键不能为空' };
        const conflict = db.actions.find((item) => item.id !== action.id && item.combo && item.combo.toLowerCase() === combo.toLowerCase());
        if (conflict) return { ok: false, reason: `与「${conflict.title}」冲突` };
        action.combo = combo; action.effective = true; action.reason = null;
        applyAction(action);
        return { ok: true };
      }
      case 'reset_hotkey': {
        const action = findAction(args.actionId);
        if (!action) return { ok: false, reason: '快捷键项不存在' };
        const conflict = db.actions.find((item) => item.id !== action.id && item.combo && action.defaultCombo && item.combo.toLowerCase() === action.defaultCombo.toLowerCase());
        action.combo = action.defaultCombo;
        action.effective = !conflict && Boolean(action.combo);
        action.reason = conflict ? `与「${conflict.title}」冲突` : action.combo ? null : '未设置';
        applyAction(action);
        return { ok: true };
      }
      case 'save_config':
        db.config = { ...db.config, ...(args.patch || {}) };
        return { ok: true };
      case 'reveal_path': {
        const paths = {
          data: db.dataDir, officialTools: db.officialToolsDir,
          installedTools: db.installedToolsDir, logs: `${db.dataDir}\\logs`
        };
        return { ok: true, path: paths[args.kind] || db.dataDir };
      }
      case 'get_log_tail':
        return { lines: FALLBACK_LOGS.slice(-Math.max(1, Number(args.lines) || 20)) };
      default: return { ok: true };
    }
  }

  return {
    isHosted: false,
    invoke,
    listen: previewListen,
    minimizeWindow: async () => ({ ok: true, mock: true })
  };
}

// Preview mode keeps the same event surface as the real bridge so the page can
// be poked from the console with `__hostEmit('config-changed', {})`.
const previewListeners = new Map();
function previewListen(event, cb) {
  if (!previewListeners.has(event)) previewListeners.set(event, new Set());
  previewListeners.get(event).add(cb);
  if (typeof window.__hostEmit !== 'function') {
    window.__hostEmit = (name, payload) => {
      const handlers = previewListeners.get(name);
      if (handlers) handlers.forEach((handler) => handler(payload));
    };
  }
  return () => {
    const handlers = previewListeners.get(event);
    if (handlers) handlers.delete(cb);
  };
}

async function loadHost() {
  try {
    const module = await import('./shared/host.js');
    if (module && typeof module.invoke === 'function') return module;
    throw new Error('host bridge has no invoke export');
  } catch (error) {
    console.info('[toolbox] browser preview mode:', error && error.message ? error.message : error);
    return makeFallbackHost();
  }
}

function toast(message, type = 'info') {
  const root = $('#toasts');
  if (!root) return;
  const iconName = type === 'ok' ? 'check' : type === 'warn' ? 'alert' : type === 'danger' ? 'x' : 'info';
  const node = document.createElement('div');
  node.className = `toast ${type}`;
  node.innerHTML = `<span class="toast-ico">${icon(iconName, 15)}</span><span>${escapeHtml(message)}</span>`;
  root.appendChild(node);
  setTimeout(() => {
    node.classList.add('out');
    setTimeout(() => node.remove(), 220);
  }, 3000);
}

function accentOf(tool) {
  return /^#[0-9a-f]{6}$/i.test(tool.accent || '') ? tool.accent : '#4ea1ff';
}

function toolIcon(tool, small = false) {
  const accent = accentOf(tool);
  const content = tool.iconDataUrl
    ? `<img src="${escapeAttr(tool.iconDataUrl)}" alt="" />`
    : `<span>${escapeHtml(String(tool.name || '?').trim().charAt(0))}</span>`;
  return `<div class="tool-icon${small ? ' sm' : ''}" style="background:${tint(accent, .14)};color:${accent};border:1px solid ${tint(accent, .3)}">${content}</div>`;
}

/**
 * Number of capabilities in the effective permission set the host reported.
 * Only reviewed (granted) installs show this in the card meta line.
 */
function permissionCount(tool) {
  const permissions = tool && tool.permissions;
  if (!permissions) return 0;
  const bits = ['filesOpen', 'filesSave', 'clipboardRead', 'clipboardWrite', 'data', 'externalOpen']
    .filter((key) => Boolean(permissions[key])).length;
  return bits + (Array.isArray(permissions.network) && permissions.network.length ? 1 : 0);
}

function hotkeyStatus(action) {
  if (!action.combo) return { kind: 'unset', label: '未设置', reason: '' };
  if (action.effective) return { kind: 'ok', label: '生效', reason: '' };
  return { kind: 'warn', label: '冲突', reason: action.reason || '被其它程序占用' };
}

function renderHotkeyRow(action) {
  const recording = state.recording === action.id;
  const status = hotkeyStatus(action);
  const error = state.hotkeyError && state.hotkeyError.actionId === action.id
    ? `<span class="hk-error" title="${escapeAttr(state.hotkeyError.message)}">${escapeHtml(state.hotkeyError.message)}</span>`
    : '';
  const reason = status.reason
    ? `<span class="hk-reason" title="${escapeAttr(status.reason)}">${escapeHtml(status.reason)}</span>`
    : '';
  const label = recording ? (state.recordedCombo || '按下组合键…') : (action.combo || '未设置');

  return `<div class="hk-row${recording ? ' is-recording' : ''}">
    <div class="hk-name" title="${escapeAttr(action.title)}">${escapeHtml(action.title)}</div>
    <div class="hk-combo-wrap">
      <button type="button" class="kbd-btn${action.combo ? '' : ' empty'}${recording ? ' recording' : ''}" data-record="${escapeAttr(action.id)}" title="${recording ? '按 Esc 取消，Enter 确认' : '点击录制新的快捷键'}">${escapeHtml(label)}</button>
      ${recording ? '<span class="record-hint">Esc 取消 · Enter 确认</span>' : error}
    </div>
    <div class="hk-status-wrap">
      <span class="hk-status ${status.kind}"><i class="dot"></i>${status.label}</span>
      ${reason}
    </div>
    <div class="hk-action">
      <button type="button" class="btn sm ghost" data-reset-hotkey="${escapeAttr(action.id)}" ${recording ? 'disabled' : ''}>重置</button>
    </div>
  </div>`;
}

function renderHotkeyTable(actions, toolName = '') {

    <div class="hk-row hk-head"><span>功能</span><span>快捷键</span><span>状态</span><span></span></div>

/**
 * The host prefixes tool action titles with the tool name ("序列帧对齐：导出").
 * Inside a per-tool section the header already names the tool, so drop it.
 */
function stripToolPrefix(action, toolName) {
  if (!toolName) return action;
  const prefix = `${toolName}：`;
  if (typeof action.title === 'string' && action.title.startsWith(prefix)) {
    return { ...action, title: action.title.slice(prefix.length) };
  }
  return action;
}

/* --- 9. Data actions -------------------------------------------------------- */
let refreshPromise = null;
async function refresh({ silent = false } = {}) {
  if (refreshPromise) return refreshPromise;
  refreshPromise = (async () => {
    try {
      const raw = await invoke('get_state');
      state.data = normalizeState(raw);
      state.error = null;
      state.loading = false;
      render({ preserveScroll: true });
    } catch (error) {
      state.loading = false;
      state.error = error && error.message ? error.message : String(error);
      render();
      if (!silent) toast('加载失败，请稍后重试', 'danger');
    } finally {
      refreshPromise = null;
    }
  })();
  return refreshPromise;
}

function normalizeState(raw) {
  const data = raw || {};
  const config = {
    locale: 'zh-CN', theme: 'dark', ballSide: 'right', ballY: 50,
    panelHotkey: 'Alt+Space', autostart: false, closeToTray: true,
    ...(data.config || {})
  };
  // The host may express the ball position either as a 0..1 fraction (Rust
  // `Config.ball_y`) or as a 0..100 percent. Remember which one it uses so the
  // slider always reads in percent while the patch keeps the host's unit.
  const rawY = Number(config.ballY);
  const fractionUnit = Number.isFinite(rawY) && rawY <= 1;
  const percent = fractionUnit ? rawY * 100 : (Number.isFinite(rawY) ? rawY : 50);
  return {
    version: data.version || '0.1.0',
    portable: Boolean(data.portable),
    dataDir: data.dataDir || '',
    officialToolsDir: data.officialToolsDir || '',
    installedToolsDir: data.installedToolsDir || '',
    ballYFraction: fractionUnit,
    ballYPercent: Math.min(100, Math.max(0, Math.round(percent))),
    config,
    tools: Array.isArray(data.tools) ? data.tools : [],
    actions: Array.isArray(data.actions) ? data.actions : [],
    hotkeys: data.hotkeys && typeof data.hotkeys === 'object' ? data.hotkeys : {}
  };
}

function setTab(tab) {
  if (!NAV_ITEMS.some((item) => item.id === tab) || state.tab === tab) return;
  state.tab = tab;
  state.recording = null;
  state.recordedCombo = null;
  state.hotkeyError = null;
  closeMenu();
  render({ animate: true });
  $('#view').scrollTop = 0;
}

async function savePatch(patch) {
  try {
    const result = await invoke('save_config', { patch });
    if (result && result.ok === false) throw new Error(result.error || '保存失败');
    Object.assign(state.data.config, patch);
    toast('已保存', 'ok');
    return true;
  } catch (error) {
    toast(`保存失败：${error && error.message ? error.message : error}`, 'danger');
    return false;
  }
}

async function handleToggle(key) {
  if (state.saving) return;
  const config = state.data.config;
  const previous = Boolean(config[key]);
  config[key] = !previous;
  state.saving = true;
  render({ preserveScroll: true });
  const ok = await savePatch({ [key]: config[key] });
  state.saving = false;
  if (!ok) {
    config[key] = previous;
    render({ preserveScroll: true });
  }
}

async function handleBallSide(side) {
  if (state.saving || state.data.config.ballSide === side) return;
  const previous = state.data.config.ballSide;
  state.data.config.ballSide = side;
  state.saving = true;
  render({ preserveScroll: true });
  const ok = await savePatch({ ballSide: side });
  state.saving = false;
  if (!ok) {
    state.data.config.ballSide = previous;
    render({ preserveScroll: true });
  }
}

async function handleBallY(input) {
  const value = Math.min(100, Math.max(0, Number(input.value) || 0));
  const data = state.data;
  const previous = data.ballYPercent;
  data.ballYPercent = value;
  // Keep the host's own unit: fraction (0..1) or percent (0..100).
  const patchValue = data.ballYFraction ? value / 100 : value;
  const ok = await savePatch({ ballY: patchValue });
  if (!ok) data.ballYPercent = previous;
}

async function openTool(id, button) {
  const tool = state.data.tools.find((item) => item.id === id);
  if (!tool) return;
  if (button) button.disabled = true;
  try {
    const result = await invoke('open_tool', { id });
    if (result && result.ok === false) throw new Error(result.error || '打开失败');
    toast(`已打开「${tool.name}」`, 'ok');
  } catch (error) {
    toast(`打开失败：${error && error.message ? error.message : error}`, 'danger');
  } finally {
    if (button && document.body.contains(button)) button.disabled = false;
  }
}

/**
 * Two-phase third-party install.
 *
 * 1. `inspect_tool_zip` unpacks + validates the picked zip into a staging dir
 *    and returns the review data; nothing is installed yet.
 * 2. The user reviews the permissions in a dialog; only after confirming do we
 *    call `install_tool` with the granted subset. Cancel tells the host to drop
 *    the staged copy and leaves no tool installed.
 */
async function installTool(button) {
  if (state.installing) return;
  state.installing = true;
  setInstallButtonBusy(button, '正在检查安装包…');
  try {
    const inspection = await invoke('inspect_tool_zip');
    if (!inspection || inspection.ok === false) {
      if (inspection && inspection.error === 'cancelled') toast('已取消安装', 'info');
      else toast(inspection && inspection.error ? `安装失败：${inspection.error}` : '安装失败', 'warn');
      return;
    }
    // Explicit permission review; null means the user cancelled.
    const granted = await reviewInstallDialog(inspection);
    if (!granted) {
      try {
        await invoke('install_tool', { inspectionId: inspection.inspectionId, granted: null });
      } catch (error) {
        console.warn('[toolbox] discard pending install failed', error);
      }
      toast('已取消安装，未做任何更改', 'info');
      return;
    }
    setInstallButtonBusy(button, '正在安装…');
    const result = await invoke('install_tool', { inspectionId: inspection.inspectionId, granted });
    if (result && result.ok) {
      // Clear the busy flag before refetching: `refresh` re-renders the dropzone
      // and must not paint the "installing…" state.
      state.installing = false;
      toast(`安装成功：${result.name || result.id || '工具'}`, 'ok');
      await refresh({ silent: true });
      return;
    }
    if (result && result.error === 'cancelled') {
      toast('已取消安装，未做任何更改', 'info');
    } else {
      toast(result && result.error ? `安装失败：${result.error}` : '安装失败', 'warn');
    }
  } catch (error) {
    toast(`安装失败：${error && error.message ? error.message : error}`, 'danger');
  } finally {
    state.installing = false;
    setInstallButtonBusy(button, null);
  }
}

function setInstallButtonBusy(button, label) {
  if (!button) return;
  if (label) {
    button.disabled = true;
    const strong = button.querySelector('strong');
    if (strong) strong.textContent = label;
    return;
  }
  if (!document.body.contains(button)) return;
  button.disabled = false;
  const strong = button.querySelector('strong');
  if (strong) strong.textContent = '从 zip 安装第三方工具…';
}

/**
 * Permission review dialog shown before a third-party tool is installed.
 *
 * Resolves to the list of granted permission keys when the user confirms, or
 * `null` when the review is cancelled. Every declared permission is checked by
 * default; the user can untick any of them and the tool then runs without it.
 */
function reviewInstallDialog(inspection) {
  return new Promise((resolve) => {
    const declared = (Array.isArray(inspection.permissionItems) ? inspection.permissionItems : [])
      .filter((item) => item && item.bit);
    const name = inspection.name || inspection.id || '未知工具';
    const author = inspection.author || '未知作者';
    const version = inspection.version || '0.0.0';
    const domainHint = Array.isArray(inspection.permissions && inspection.permissions.network)
      ? inspection.permissions.network
      : [];
    const fileCount = Number(inspection.fileCount) || 0;
    const totalBytes = Number(inspection.totalBytes) || 0;

    const rows = declared.length
      ? declared.map((item) => `<label class="perm-row">
          <input type="checkbox" data-perm-key="${escapeAttr(item.key)}" checked />
          <span class="perm-copy">
            <span class="perm-label">${escapeHtml(item.label || item.key)}<code>${escapeHtml(item.key)}</code></span>
            <span class="perm-detail">${escapeHtml(item.detail || '')}</span>
          </span>
        </label>`).join('')
      : '<div class="review-empty">该工具未申请任何额外权限</div>';

    const upgrade = inspection.isUpgrade
      ? `<div class="review-upgrade">${icon('alert', 15)}<span>「${escapeHtml(name)}」已安装，继续将覆盖当前版本，旧版本会自动备份到 data/backups/tools/。</span></div>`
      : '';
    const networkNote = domainHint.length
      ? `<span class="review-stat">${icon('info', 12)}可访问域名：${escapeHtml(domainHint.join('、'))}</span>`
      : '';

    const backdrop = document.createElement('div');
    backdrop.className = 'modal-backdrop';
    backdrop.innerHTML = `<div class="modal review-modal" role="dialog" aria-modal="true" aria-labelledby="review-title">
      <div class="review-head">
        ${toolIcon({ name, iconDataUrl: inspection.iconDataUrl, accent: '#4ea1ff' })}
        <div class="review-title">
          <h2 id="review-title">安装「${escapeHtml(name)}」</h2>
          <div class="review-sub">
            <span class="pill version-pill">v${escapeHtml(version)}</span>
            <span>${escapeHtml(author)}</span>
            <span>·</span>
            <code title="工具 id">${escapeHtml(inspection.id || name)}</code>
          </div>
        </div>
      </div>
      <p class="review-desc">${escapeHtml(inspection.description || '该工具未提供描述。')}</p>
      <div class="review-stats">
        <span class="review-stat">${icon('folder', 12)}${fileCount} 个文件</span>
        <span class="review-stat">${icon('download', 12)}解压后 ${formatBytes(totalBytes)}</span>
        ${networkNote}
      </div>
      ${upgrade}
      <div class="review-section-title">${icon('sliders', 13)}权限授权
        <span class="hint">${declared.length ? `已声明 ${declared.length} 项，可取消勾选` : '无额外权限'}</span>
      </div>
      <div class="perm-list">${rows}</div>
      <div class="review-note">只有勾选的权限会被授予该工具，未勾选的权限在运行时会被桥接层直接拒绝。请只安装来自可信来源的工具。</div>
      <div class="modal-actions">
        <button type="button" class="btn" data-review-cancel>取消</button>
        <button type="button" class="btn primary" data-review-ok>${icon('download', 13)}安装</button>
      </div>
    </div>`;

    const previousFocus = document.activeElement;
    const finish = (value) => {
      document.removeEventListener('keydown', onKey, true);
      backdrop.remove();
      if (previousFocus && typeof previousFocus.focus === 'function') previousFocus.focus();
      resolve(value);
    };
    const selected = () => [...backdrop.querySelectorAll('[data-perm-key]')]
      .filter((box) => box.checked)
      .map((box) => box.dataset.permKey);
    const onKey = (event) => {
      if (event.key === 'Escape') {
        event.preventDefault();
        event.stopPropagation();
        finish(null);
      }
    };
    backdrop.addEventListener('click', (event) => {
      if (event.target === backdrop) finish(null);
      if (event.target.closest('[data-review-cancel]')) finish(null);
      if (event.target.closest('[data-review-ok]')) finish(selected());
    });
    document.addEventListener('keydown', onKey, true);
    document.body.appendChild(backdrop);
    const ok = backdrop.querySelector('[data-review-ok]');
    if (ok) ok.focus();
  });
}

async function revealPath(kind) {
  try {
    await invoke('reveal_path', { kind });
    toast('已打开目录', 'ok');
  } catch (error) {
    toast(`无法打开目录：${error && error.message ? error.message : error}`, 'danger');
  }
}

async function copyText(text) {
  if (!text) {
    toast('路径为空，无法复制', 'warn');
    return;
  }
  try {
    await navigator.clipboard.writeText(text);
    toast('路径已复制', 'ok');
  } catch (error) {
    try {
      const area = document.createElement('textarea');
      area.value = text;
      area.style.position = 'fixed';
      area.style.opacity = '0';
      document.body.appendChild(area);
      area.select();
      document.execCommand('copy');
      area.remove();
      toast('路径已复制', 'ok');
    } catch (fallbackError) {
      toast('复制失败，请手动选择路径', 'danger');
    }
  }
}

/* --- 10. Hotkey recording --------------------------------------------------- */
function startRecording(actionId) {
  state.recording = actionId;
  state.recordedCombo = null;
  state.hotkeyError = null;
  render({ preserveScroll: true });
  requestAnimationFrame(() => {
    const target = $('.kbd-btn.recording');
    if (target) target.focus();
  });
}

function cancelRecording() {
  state.recording = null;
  state.recordedCombo = null;
  state.hotkeyError = null;
  render({ preserveScroll: true });
}

function normalizeKey(event) {
  const code = event.code || '';
  if (/^Key[A-Z]$/.test(code)) return code.slice(3);
  if (/^Digit[0-9]$/.test(code)) return code.slice(5);
  if (/^F([1-9]|1[0-9]|2[0-4])$/.test(code)) return code;
  if (KEY_NAMES[code]) return KEY_NAMES[code];
  return null;
}

function comboFromEvent(event) {
  const key = normalizeKey(event);
  if (!key) return null;
  const parts = [];
  if (event.ctrlKey) parts.push('Ctrl');
  if (event.altKey) parts.push('Alt');
  if (event.shiftKey) parts.push('Shift');
  if (event.metaKey) parts.push('Win');
  parts.push(key);
  return parts.join('+');
}

async function commitRecording() {
  if (!state.recording || state.committing) return;
  if (!state.recordedCombo) {
    toast('请先按下一个非修饰键', 'warn');
    return;
  }
  const actionId = state.recording;
  const combo = state.recordedCombo;
  state.committing = true;
  try {
    const result = await invoke('set_hotkey', { actionId, combo });
    if (result && result.ok === false) {
      state.recording = null;
      state.recordedCombo = null;
      state.hotkeyError = { actionId, message: result.reason || '快捷键设置失败' };
      render({ preserveScroll: true });
      toast(result.reason || '快捷键设置失败', 'warn');
      return;
    }
    state.recording = null;
    state.recordedCombo = null;
    state.hotkeyError = null;
    await refresh({ silent: true });
    toast('快捷键已更新', 'ok');
  } catch (error) {
    state.hotkeyError = { actionId, message: error && error.message ? error.message : '快捷键设置失败' };
    render({ preserveScroll: true });
    toast('快捷键设置失败', 'danger');
  } finally {
    state.committing = false;
  }
}

async function resetHotkey(actionId) {
  try {
    const result = await invoke('reset_hotkey', { actionId });
    if (result && result.ok === false) {
      toast(result.reason || '重置失败', 'warn');
      return;
    }
    state.hotkeyError = null;
    await refresh({ silent: true });
    toast('已恢复默认快捷键', 'ok');
  } catch (error) {
    toast(`重置失败：${error && error.message ? error.message : error}`, 'danger');
  }
}

/* --- 11. Context menu ------------------------------------------------------- */
function closeMenu() {
  if (menuEl) {
    menuEl.remove();
    menuEl = null;
    menuToolId = null;
  }
}

/**
 * Promise-based confirm dialog. `window.confirm` blocks the WebView message
 * loop (and every pending IPC promise with it), so use an in-page modal.
 */
function confirmDialog({ title, message, confirmLabel = '确定', cancelLabel = '取消', danger = false }) {
  return new Promise((resolve) => {
    const backdrop = document.createElement('div');
    backdrop.className = 'modal-backdrop';
    backdrop.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-head">
        <div class="modal-ico${danger ? ' danger' : ''}">${icon(danger ? 'alert' : 'info', 18)}</div>
        <div><h2 id="modal-title">${escapeHtml(title)}</h2><p>${escapeHtml(message)}</p></div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn" data-modal-cancel>${escapeHtml(cancelLabel)}</button>
        <button type="button" class="btn ${danger ? 'danger' : 'primary'}" data-modal-ok>${escapeHtml(confirmLabel)}</button>
      </div>
    </div>`;
    const previousFocus = document.activeElement;
    const finish = (value) => {
      document.removeEventListener('keydown', onKey, true);
      backdrop.remove();
      if (previousFocus && typeof previousFocus.focus === 'function') previousFocus.focus();
      resolve(value);
    };
    const onKey = (event) => {
      if (event.key === 'Escape') { event.preventDefault(); event.stopPropagation(); finish(false); }
      if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); event.stopPropagation(); finish(true); }
    };
    backdrop.addEventListener('click', (event) => {
      if (event.target === backdrop) finish(false);
      if (event.target.closest('[data-modal-ok]')) finish(true);
      if (event.target.closest('[data-modal-cancel]')) finish(false);
    });
    document.addEventListener('keydown', onKey, true);
    document.body.appendChild(backdrop);
    const ok = backdrop.querySelector('[data-modal-ok]');
    if (ok) ok.focus();
  });
}

function openToolMenu(button, tool) {
  closeMenu();
  menuToolId = tool.id;
  const items = [
    { action: 'close', label: '关闭', icon: 'x' },
    { action: 'reveal', label: '打开所在目录', icon: 'folder' },
    { action: 'toggle', label: tool.enabled ? '禁用' : '启用', icon: tool.enabled ? 'pause' : 'check' }
  ];
  if (tool.source !== 'official') items.push({ separator: true }, { action: 'uninstall', label: '卸载', icon: 'trash', danger: true });

  menuEl = document.createElement('div');
  menuEl.className = 'ctx-menu';
  menuEl.setAttribute('role', 'menu');
  menuEl.innerHTML = items.map((item) => item.separator
    ? '<div class="ctx-sep"></div>'
    : `<button type="button" class="ctx-item${item.danger ? ' danger' : ''}" role="menuitem" data-menu-action="${item.action}" data-menu-tool="${escapeAttr(tool.id)}">${icon(item.icon, 14)}<span>${item.label}</span></button>`
  ).join('');
  document.body.appendChild(menuEl);

  const rect = button.getBoundingClientRect();
  const menuRect = menuEl.getBoundingClientRect();
  let left = Math.min(rect.right - menuRect.width, window.innerWidth - menuRect.width - 8);
  let top = rect.bottom + 6;
  if (top + menuRect.height > window.innerHeight - 8) top = rect.top - menuRect.height - 6;
  menuEl.style.left = `${Math.max(8, left)}px`;
  menuEl.style.top = `${Math.max(8, top)}px`;
  const first = menuEl.querySelector('.ctx-item');
  if (first) first.focus();
}

async function handleMenuAction(action, id) {
  const tool = state.data.tools.find((item) => item.id === id);
  if (!tool) return;
  if (action === 'close') {
    try {
      await invoke('close_tool', { id });
      toast(`已关闭「${tool.name}」`, 'ok');
    } catch (error) {
      toast('关闭失败', 'danger');
    }
    return;
  }
  if (action === 'reveal') {
    await revealPath(tool.source === 'official' ? 'officialTools' : 'installedTools');
    return;
  }
  if (action === 'toggle') {
    try {
      const result = await invoke('set_tool_enabled', { id, enabled: !tool.enabled });
      if (result && result.ok === false) throw new Error(result.error || '操作失败');
      tool.enabled = !tool.enabled;
      render({ preserveScroll: true });
      toast(tool.enabled ? `已启用「${tool.name}」` : `已禁用「${tool.name}」`, 'ok');
    } catch (error) {
      toast(`操作失败：${error && error.message ? error.message : error}`, 'danger');
    }
    return;
  }
  if (action === 'uninstall') {
    const confirmed = await confirmDialog({
      title: `卸载「${tool.name}」`,
      message: '工具目录将被删除，已保存的工具数据不会保留。此操作不可撤销。',
      confirmLabel: '卸载',
      danger: true
    });
    if (!confirmed) return;
    try {
      const result = await invoke('uninstall_tool', { id });
      if (result && result.ok === false) throw new Error(result.error || '卸载失败');
      toast(`已卸载「${tool.name}」`, 'ok');
      await refresh({ silent: true });
    } catch (error) {
      toast(`卸载失败：${error && error.message ? error.message : error}`, 'danger');
    }
  }
}

/* --- 12. Events ------------------------------------------------------------- */
function onRecordKey(event) {
  if (!state.recording) return;
  if (event.key === 'Escape') {
    event.preventDefault();
    event.stopPropagation();
    cancelRecording();
    return;
  }
  if (event.key === 'Enter') {
    event.preventDefault();
    event.stopPropagation();
    commitRecording();
    return;
  }
  if (MODIFIER_KEYS.has(event.key)) {
    event.preventDefault();
    return;
  }
  const combo = comboFromEvent(event);
  if (!combo) return;
  event.preventDefault();
  event.stopPropagation();
  state.recordedCombo = combo;
  const target = $('.kbd-btn.recording');
  if (target) target.textContent = combo;
}

async function onClick(event) {
  const target = event.target instanceof Element ? event.target : event.target.parentElement;
  if (!target) return;

  const menuAction = target.closest('[data-menu-action]');
  if (menuAction) {
    const action = menuAction.dataset.menuAction;
    const id = menuAction.dataset.menuTool;
    closeMenu();
    await handleMenuAction(action, id);
    return;
  }
  if (menuEl && !menuEl.contains(target) && !target.closest('[data-menu-tool]')) closeMenu();

  const nav = target.closest('[data-tab]');
  if (nav) { setTab(nav.dataset.tab); return; }

  const menuButton = target.closest('[data-menu-tool]');
  if (menuButton) {
    const tool = state.data && state.data.tools.find((item) => item.id === menuButton.dataset.menuTool);
    if (tool) openToolMenu(menuButton, tool);
    return;
  }

  const refreshButton = target.closest('[data-refresh]');
  if (refreshButton) { await refresh(); toast('已刷新', 'ok'); return; }

  const retryButton = target.closest('[data-retry]');
  if (retryButton) { state.loading = true; state.error = null; render(); await refresh(); return; }

  const openButton = target.closest('[data-open-tool]');
  if (openButton) { await openTool(openButton.dataset.openTool, openButton); return; }

  const installButton = target.closest('[data-install]');
  if (installButton) { await installTool(installButton); return; }

  const revealButton = target.closest('[data-reveal]');
  if (revealButton) { await revealPath(revealButton.dataset.reveal); return; }

  const copyButton = target.closest('[data-copy]');
  if (copyButton) { await copyText(copyButton.dataset.copy); return; }

  const recordButton = target.closest('[data-record]');
  if (recordButton) { startRecording(recordButton.dataset.record); return; }

  const resetButton = target.closest('[data-reset-hotkey]');
  if (resetButton) { await resetHotkey(resetButton.dataset.resetHotkey); return; }

  const toggle = target.closest('[data-toggle]');
  if (toggle) { await handleToggle(toggle.dataset.toggle); return; }

  const side = target.closest('[data-ballside]');
  if (side) { await handleBallSide(side.dataset.ballside); return; }

  const restart = target.closest('[data-restart]');
  if (restart) {
    try {
      await invoke('restart_app');
      toast(host && host.isHosted ? '正在重启工具箱…' : '浏览器预览：已模拟重启', 'info');
    } catch (error) {
      toast('重启失败', 'danger');
    }
    return;
  }

  const quit = target.closest('[data-quit]');
  if (quit) {
    try {
      await invoke('quit_app');
      toast(host && host.isHosted ? '工具箱已退出' : '浏览器预览：已模拟退出', 'info');
    } catch (error) {
      toast('退出失败', 'danger');
    }
  }
}

function onInput(event) {
  const target = event.target;
  if (target && target.id === 'ballY') {
    const value = Math.min(100, Math.max(0, Number(target.value) || 0));
    target.style.setProperty('--fill', `${value}%`);
    const output = $('#ballYOut');
    if (output) output.textContent = `${value}%`;
  }
}

async function onChange(event) {
  const target = event.target;
  if (target && target.id === 'ballY') {
    await handleBallY(target);
  }
}

/* --- 13. Boot --------------------------------------------------------------- */
function bindWindowControls() {
  const minimize = $('#win-min');
  const close = $('#win-close');
  minimize.addEventListener('click', async () => {
    try {
      if (!host || !host.isHosted) {
        toast('浏览器预览：已模拟最小化', 'info');
        return;
      }
      const result = host && typeof host.minimizeWindow === 'function'
        ? await host.minimizeWindow()
        : { ok: false };
      if (!result || result.ok === false) toast('当前宿主未提供最小化命令', 'warn');
    } catch (error) {
      toast('最小化失败', 'danger');
    }
  });
  close.addEventListener('click', async () => {
    try {
      await invoke('close_window', { label: 'main' });
      if (!host || !host.isHosted) toast('浏览器预览：已模拟关闭窗口', 'info');
    } catch (error) {
      toast('关闭失败', 'danger');
    }
  });
}

async function boot() {
  render();
  document.addEventListener('click', onClick);
  document.addEventListener('keydown', onRecordKey, true);
  document.addEventListener('input', onInput);
  document.addEventListener('change', onChange);
  document.addEventListener('scroll', () => closeMenu(), true);
  window.addEventListener('resize', closeMenu);

  host = await loadHost();
  invoke = host.invoke;
  listen = host.listen;
  bindWindowControls();

  listen('tools-changed', () => refresh({ silent: true }));
  listen('config-changed', () => refresh({ silent: true }));

  await refresh();
}

boot().catch((error) => {
  state.loading = false;
  state.error = error && error.message ? error.message : String(error);
  render();
  toast('工具箱启动失败', 'danger');
});
</script>
</body>
